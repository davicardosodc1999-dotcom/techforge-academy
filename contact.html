<!DOCTYPE html><html lang="en" lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06080D"><link rel="stylesheet" href="css/style.css"><style>
.info-page{min-height:100vh;padding:120px 20px 80px;background:#06080d}.info-wrap{width:min(92%,980px);margin:auto}.info-back{display:inline-flex;margin-bottom:30px;color:#00e5ff;text-decoration:none;font-weight:800}.info-card{background:#0b121b;border:1px solid rgba(0,229,255,.14);border-radius:22px;padding:clamp(24px,5vw,48px);box-shadow:0 30px 80px rgba(0,0,0,.25)}.info-kicker{color:#00e5ff;font-size:.72rem;font-weight:900;letter-spacing:.12em}.info-card h1{font-family:var(--font-title);font-size:clamp(2.4rem,6vw,5rem);line-height:.98;margin:12px 0 20px}.info-card h2{font-family:var(--font-title);margin-top:34px}.info-card p,.info-card li{color:#aebbc7;line-height:1.8}.info-card ul{padding-left:22px}.info-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.form-grid{display:grid;gap:16px;margin-top:24px}.form-grid label{display:grid;gap:7px;color:#dfe8ef;font-weight:700}.form-grid input,.form-grid textarea{width:100%;padding:14px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#071018;color:white}.form-grid textarea{min-height:150px;resize:vertical}.notice{margin-top:20px;padding:14px 16px;border:1px solid rgba(0,229,255,.16);border-radius:13px;color:#aebbc7;background:rgba(0,229,255,.03)}
</style><title>Contact | TechForge Academy</title><meta name="description" content="Contact the learning platform."><link rel="canonical" href="https://YOUR-DOMAIN.com/contact.html">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="site.webmanifest">
</head><body><main class="info-page"><div class="info-wrap"><a class="info-back" href="index.html">← BACK TO HOME</a><section class="info-card"><span class="info-kicker">CONTACT</span><h1>How can we help?</h1><p>This static development form prepares an email in your default email application. You can contact the platform directly at <a href="mailto:juarezimoveispronto@gmail.com">juarezimoveispronto@gmail.com</a>.</p><form id="contact-form" class="form-grid"><label>Name<input id="contact-name" required></label><label>Email<input id="contact-email" type="email" required></label><label>Subject<input id="contact-subject" required></label><label>Message<textarea id="contact-message" required></textarea></label><button class="btn btn-primary" type="submit">PREPARE EMAIL</button></form><div id="contact-status" class="notice" aria-live="polite">No message is sent automatically from this development build.</div></section></div></main><script>
document.getElementById("contact-form").addEventListener("submit",function(e){e.preventDefault();const n=document.getElementById("contact-name").value.trim(),em=document.getElementById("contact-email").value.trim(),s=document.getElementById("contact-subject").value.trim(),m=document.getElementById("contact-message").value.trim();document.getElementById("contact-status").textContent="Message prepared. Your email application should open with the recipient filled in.";location.href="mailto:juarezimoveispronto@gmail.com?subject="+encodeURIComponent(s)+"&body="+encodeURIComponent("Name: "+n+"\nEmail: "+em+"\n\n"+m);});
</script></body></html>
